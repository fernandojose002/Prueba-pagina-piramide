<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ADB Cloud Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL DE AUTENTICACIÓN -->
    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- PESTAÑAS (LOGIN / REGISTRO) -->
        <div class="flex border-b border-slate-700 mb-6">
            <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 focus:outline-none transition">
                Iniciar Sesión
            </button>
            <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none transition">
                Crear Cuenta
            </button>
        </div>

        <!-- MENSAJE DE ERROR / ÉXITO -->
        <div id="auth-alert" class="hidden p-3 mb-4 text-xs rounded-lg border text-center"></div>

        <!-- FORMULARIO 1: INICIAR SESIÓN -->
        <form id="form-login-auth" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tu@email.com" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg text-sm transition duration-200">
                Entrar a mi Cuenta
            </button>
        </form>

        <!-- FORMULARIO 2: REGISTRARSE -->
        <form id="form-register-auth" onsubmit="handleRegister(event)" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="tu@email.com" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" minlength="6" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Código de Referido (Opcional)</label>
                <input type="text" id="reg-ref" placeholder="Ej: REF-A8F2" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-sm text-emerald-400 font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg text-sm transition duration-200">
                Registrarme y Obtener Código
            </button>
        </form>

    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api/auth';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('reg-ref').value = refCode;
                switchAuthTab('register');
            }
        });

        function switchAuthTab(tab) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login-auth');
            const formRegister = document.getElementById('form-register-auth');
            showAlert('');

            if (tab === 'login') {
                tabLogin.className = "w-1/2 py-2 text-center text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 focus:outline-none transition";
                tabRegister.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none transition";
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                tabRegister.className = "w-1/2 py-2 text-center text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 focus:outline-none transition";
                tabLogin.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none transition";
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('auth-alert');
            if (!msg) {
                alertBox.classList.add('hidden');
                return;
            }
            alertBox.classList.remove('hidden');
            if (isError) {
                alertBox.className = "p-3 mb-4 text-xs rounded-lg border text-center bg-red-500/10 border-red-500/30 text-red-400";
            } else {
                alertBox.className = "p-3 mb-4 text-xs rounded-lg border text-center bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
            }
            alertBox.innerText = msg;
        }

        async function handleLogin(e) {
            e.preventDefault();
            showAlert('');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    return showAlert(data.error || 'Credenciales incorrectas');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showAlert('¡Acceso correcto! Redirigiendo...', false);
                
                // Redirección directa a catalog.html
                setTimeout(() => {
                    window.location.href = 'catalog.html';
                }, 500);

            } catch (err) {
                console.error(err);
                showAlert('Error: No se pudo conectar con el servidor (http://localhost:3000). Asegúrate de que node server.js esté corriendo.');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            showAlert('');
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const referralCode = document.getElementById('reg-ref').value;

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, referralCode })
                });

                const data = await response.json();

                if (!response.ok) {
                    return showAlert(data.error || 'Error al registrar usuario');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showAlert('¡Registro exitoso! Redirigiendo al catálogo...', false);
                
                setTimeout(() => {
                    window.location.href = 'catalog.html';
                }, 500);

            } catch (err) {
                console.error(err);
                showAlert('Error: No se pudo conectar con el servidor (http://localhost:3000). Asegúrate de que node server.js esté corriendo.');
            }
        }
    </script>
</body>
</html>
